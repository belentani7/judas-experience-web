<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE JUDAS EXPERIENCE — BELENTANI</title>
<meta name="theme-color" content="#030407">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Importar Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root {
    --void: #030407;
    --neon: #ff073a;
    --blood: #8b0000;
    --dim: #8f878c;
    --disp: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background-color: var(--void); 
    color: #fff; 
    font-family: var(--disp); 
    overflow: hidden; 
    cursor: none; /* Ocultamos el cursor nativo */
  }

  /* El Lienzo 3D */
  #webgl-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* Viñeteado y Grano Analógico para la textura cinematográfica */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(circle at center, transparent 30%, rgba(3, 4, 7, 0.85) 100%);
    pointer-events: none;
  }
  .grain {
    position: fixed;
    inset: -50px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.04;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/></filter><rect width="200" height="200" filter="url(%23n)" opacity="1"/></svg>');
    animation: grain-shift 0.2s steps(2) infinite;
  }
  @keyframes grain-shift { 0% {transform: translate(0,0)} 100% {transform: translate(-20px, 20px)} }

  /* UI Judas OS Overlay */
  #ui-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.4em;
    color: var(--neon);
    text-shadow: 0 0 20px rgba(255,7,58,0.6);
  }
  .telemetry {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--dim);
    text-align: right;
    line-height: 1.6;
    letter-spacing: 0.15em;
  }
  .telemetry b { color: var(--neon); }

  .footer {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--dim);
  }

  /* Cursor interactivo HUD */
  #cursor-dot {
    position: fixed;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    z-index: 100;
    pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #fff;
  }
  #cursor-ring {
    position: fixed;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,7,58,0.5);
    border-radius: 50%;
    z-index: 99;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, border-color 0.2s;
  }
</style>

<!-- BELENTANI palette -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Cinzel+Decorative:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style id="belentani-palette">
/* BELENTANI - rojo sobre negro/blanco + verde 3% + mono en codigo */
:root{ --void:#050505; --neon:#ff003c; --blood:#8b0000; --dim:rgba(255,255,255,.5);
 --term-green:#00ff41; --disp:'Chakra Petch',sans-serif; --mono:'JetBrains Mono',monospace; --display:'Orbitron',sans-serif; }
.logo{font-family:var(--display);}
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div id="ui-layer">
  <div class="header">
    <div class="logo">BELENTANI</div>
    <div class="telemetry">
      SYS.CORE // <b style="color:var(--term-green)">ONLINE</b><br>
      PARTICLES // <b id="p-count">150,000</b><br>
      GPU COMPUTE // <b>ACTIVE</b><br>
      GRAV. ANOMALY // <b id="g-force">0.00</b>
    </div>
  </div>
  <div class="footer">
    THE JUDAS EXPERIENCE — BELENTANI
  </div>
</div>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script>
/**
 * BELENTANI // JUDAS ACCRETION ENGINE
 * GPU-Accelerated Interactive Particle System
 */

const canvas = document.getElementById('webgl-canvas');
const W = window.innerWidth;
const H = window.innerHeight;

// 1. Setup Básico de Three.js
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
// Cámara con perspectiva para dar profundidad real
const camera = new THREE.PerspectiveCamera(45, W / H, 1, 2000);
camera.position.set(0, 300, 700);
camera.lookAt(0, 0, 0);

// 2. Control de Cursor y Raycaster 3D
const mouse = new THREE.Vector2(9999, 9999);
const targetMouse = new THREE.Vector2(9999, 9999);
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Plano invisible en Y=0
const mouse3D = new THREE.Vector3(9999, 0, 9999);

const curDot = document.getElementById('cursor-dot');
const curRing = document.getElementById('cursor-ring');

window.addEventListener('mousemove', (e) => {
  // Cursor UI
  curDot.style.left = e.clientX + 'px';
  curDot.style.top = e.clientY + 'px';
  
  // Normalizar coordenadas para WebGL (-1 a +1)
  targetMouse.x = (e.clientX / W) * 2 - 1;
  targetMouse.y = -(e.clientY / H) * 2 + 1;
});

// Suavizado del movimiento del cursor
let ringX = W/2, ringY = H/2;
function updateUI() {
  const mx = (targetMouse.x * 0.5 + 0.5) * W;
  const my = (-targetMouse.y * 0.5 + 0.5) * H;
  ringX += (mx - ringX) * 0.15;
  ringY += (my - ringY) * 0.15;
  curRing.style.left = ringX + 'px';
  curRing.style.top = ringY + 'px';
  requestAnimationFrame(updateUI);
}
requestAnimationFrame(updateUI);


// 3. Generación del Disco de Acreción (Geometría)
const particleCount = 150000; // Alta densidad para simular fluido
const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(particleCount * 3);
const basePositions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
const randoms = new Float32Array(particleCount); // Para variaciones orgánicas

const colorNeon = new THREE.Color('#ff073a');
const colorBlood = new THREE.Color('#8b0000');
const colorObsidian = new THREE.Color('#1a0508');

for (let i = 0; i < particleCount; i++) {
  // Distribución en disco con centro hueco (agujero negro)
  const radius = 50 + Math.random() * 450;
  const angle = Math.random() * Math.PI * 2;
  
  // Elevación orgánica (grosor del disco)
  const height = (Math.random() - 0.5) * (6000 / radius); 
  
  const x = Math.cos(angle) * radius;
  const y = height;
  const z = Math.sin(angle) * radius;

  positions[i * 3] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  basePositions[i * 3] = x;
  basePositions[i * 3 + 1] = y;
  basePositions[i * 3 + 2] = z;

  // Asignación de color basada en distancia al centro (Blue shift/Red shift simulado)
  const mixedColor = colorObsidian.clone();
  if (radius < 150) {
    mixedColor.lerp(colorNeon, Math.random());
  } else {
    mixedColor.lerp(colorBlood, Math.random());
  }

  colors[i * 3] = mixedColor.r;
  colors[i * 3 + 1] = mixedColor.g;
  colors[i * 3 + 2] = mixedColor.b;

  // Tamaños variables para profundidad
  sizes[i] = Math.random() * 2.5 + 0.5;
  randoms[i] = Math.random();
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aBasePos', new THREE.BufferAttribute(basePositions, 3));
geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

// 4. El Motor: Custom Shader Material (Físicas en GPU)
const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0.0 },
    uMouse3D: { value: new THREE.Vector3(9999, 0, 9999) },
    uResolution: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: `
    uniform float uTime;
    uniform vec3 uMouse3D;
    
    attribute vec3 aBasePos;
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aRandom;
    
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vColor = aColor;
      vec3 pos = aBasePos;

      // 4.1 ROTACIÓN ORBITAL
      // La velocidad depende de la distancia al centro (leyes de Kepler falsas)
      float radius = length(pos.xz);
      float speed = 250.0 / (radius + 50.0);
      float angle = uTime * speed + aRandom * 6.28;
      
      float c = cos(angle);
      float s = sin(angle);
      mat2 rot = mat2(c, -s, s, c);
      pos.xz = rot * pos.xz;

      // Movimiento ondulatorio intrínseco (ruido)
      pos.y += sin(uTime * 2.0 + radius * 0.05 + aRandom * 10.0) * 15.0;

      // 4.2 INTERACCIÓN CON EL CURSOR (GRAVEDAD/REPULSIÓN)
      // Distancia de la partícula al cursor en el espacio 3D
      float distToMouse = distance(pos, uMouse3D);
      float forceRadius = 180.0;
      
      if (distToMouse < forceRadius) {
        // Fuerza de repulsión fluida
        float force = (forceRadius - distToMouse) / forceRadius;
        // Suavizado de la fuerza (Smoothstep)
        force = force * force * (3.0 - 2.0 * force); 
        
        vec3 dir = normalize(pos - uMouse3D);
        // Empujar hacia afuera y hacia arriba/abajo
        pos += dir * force * 80.0;
        pos.y += sin(force * 3.14) * 40.0 * (aRandom > 0.5 ? 1.0 : -1.0);
        
        // Iluminar las partículas afectadas
        vColor += vec3(1.0, 0.2, 0.4) * force * 0.8;
      }

      // Atenuación en los bordes
      vAlpha = smoothstep(500.0, 200.0, radius);

      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      
      // Tamaño dinámico basado en perspectiva
      gl_PointSize = aSize * (400.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      // Dibujar círculos suaves en lugar de cuadrados pixelados
      vec2 coord = gl_PointCoord - vec2(0.5);
      float dist = length(coord);
      
      if (dist > 0.5) discard;
      
      // Gradiente suave (Glow)
      float alpha = smoothstep(0.5, 0.1, dist) * vAlpha;
      
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending // Crucial para el efecto de luz neón/fuego
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// 5. Bucle de Renderizado y Física
const clock = new THREE.Clock();
const uiForce = document.getElementById('g-force');

function animate() {
  const elapsedTime = clock.getElapsedTime();
  
  // Interpolación del ratón
  mouse.x += (targetMouse.x - mouse.x) * 0.1;
  mouse.y += (targetMouse.y - mouse.y) * 0.1;

  // Proyectar ratón 2D al plano 3D (Z=0)
  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, mouse3D);
  
  // Pasar valores a la GPU
  material.uniforms.uTime.value = elapsedTime;
  material.uniforms.uMouse3D.value.copy(mouse3D);

  // Actualizar UI sutilmente
  const velocity = Math.abs(targetMouse.x - mouse.x) + Math.abs(targetMouse.y - mouse.y);
  uiForce.innerText = (velocity * 100).toFixed(2);

  // Rotar ligeramente la cámara para darle vida al espacio
  camera.position.x = Math.sin(elapsedTime * 0.1) * 100;
  camera.position.z = 700 + Math.cos(elapsedTime * 0.1) * 50;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// Responsive
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

// Start
animate();
</script>

</body>
</html>
